name: keepalive

# Free-сервис Render засыпает через ~15 минут без входящего HTTP-трафика
# (long polling в Telegram входящим трафиком не считается).
#
# ВАЖНО: расписание GitHub Actions нестабильно — на малоактивных репозиториях
# интервалы доходили до 40–60 минут, сервис успевал уснуть. Поэтому:
#   1) пингуем каждые 5 минут (минимум, который даёт GitHub);
#   2) при неудаче повторяем 3 раза — первый запрос к спящему сервису
#      часто обрывается, пока контейнер поднимается;
#   3) на компьютере дополнительно работает keepalive_pc.ps1 (каждые 5 минут).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Пинг /health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Разбудить сервис
        run: |
          url="https://tg-tickets.onrender.com/health"
          for attempt in 1 2 3; do
            echo "попытка $attempt"
            if curl -fsS --max-time 45 "$url"; then
              echo
              echo "сервис отвечает"
              exit 0
            fi
            echo "не ответил, ждём 20 секунд (контейнер просыпается)"
            sleep 20
          done
          echo "сервис не ответил за три попытки"
          exit 1
